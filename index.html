<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<meta name="description" content="HARTAZ Property Consultant">
<title>HARTAZ — Property Consultant</title>
<style>
:root{
  --bg:#f7f5f0;
  --card:#ffffff;
  --text:#151515;
  --muted:#777;
  --accent:#b51f2b;
  --accent2:#d6a84f;
  --border:#e8e4dc;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at top right, rgba(214,168,79,.12), transparent 32%),
    var(--bg);
}
.container{width:min(680px,92%);margin:auto;padding:28px 0 45px}
.profile{text-align:center;padding:12px 0 20px}
.logo{
  width:86px;height:86px;margin:0 auto 15px;border-radius:24px;
  background:linear-gradient(145deg,#111,#2b2b2b);
  display:flex;align-items:center;justify-content:center;
  color:#d6a84f;font-weight:800;font-size:22px;letter-spacing:2px;
  box-shadow:0 12px 30px rgba(0,0,0,.13);
}
h1{font-size:27px;margin:0;font-weight:800;letter-spacing:.5px}
.tagline{margin:7px 0 0;color:var(--muted);font-size:14px}
.socials{display:flex;justify-content:center;gap:9px;margin-top:15px}
.socials a{
  width:38px;height:38px;border:1px solid var(--border);background:#fff;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#222;text-decoration:none;font-size:14px;font-weight:700;
}
.links{display:grid;gap:12px}
.link{
  min-height:58px;border:1px solid var(--border);background:var(--card);
  border-radius:16px;padding:12px 17px;text-decoration:none;color:var(--text);
  display:flex;align-items:center;gap:13px;
  box-shadow:0 5px 18px rgba(0,0,0,.035);
  transition:.18s ease;
}
.link:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(0,0,0,.08)}
.icon{
  width:38px;height:38px;border-radius:11px;background:#f3f0ea;
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.link strong{font-size:15px}
.link small{display:block;color:var(--muted);margin-top:2px;font-size:12px}
.arrow{margin-left:auto;color:#999;font-size:20px}
.section-title{
  margin:29px 2px 12px;font-size:12px;font-weight:800;
  letter-spacing:1.4px;text-transform:uppercase;color:#777;
}
.property{
  background:#fff;border:1px solid var(--border);border-radius:19px;
  overflow:hidden;margin-bottom:14px;box-shadow:0 7px 24px rgba(0,0,0,.045);
}
.property img{width:100%;height:210px;object-fit:cover;display:block}
.property-body{padding:15px}
.badge{
  display:inline-block;background:#f3efe7;color:#70551e;
  border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;
}
.property h2{font-size:18px;margin:10px 0 5px}
.location{font-size:13px;color:var(--muted)}
.price{font-size:18px;font-weight:800;margin-top:10px}
.property-actions{display:flex;gap:9px;margin-top:13px}
.btn{
  flex:1;text-align:center;text-decoration:none;padding:11px 12px;
  border-radius:11px;font-size:13px;font-weight:700;
}
.btn.primary{background:#151515;color:#fff}
.btn.secondary{background:#f5f2ec;color:#222}
.footer{text-align:center;color:#999;font-size:11px;margin-top:32px}
</style>
</head>
<body>
<main class="container">

  <section class="profile">
    <div class="logo">H</div>
    <h1>HARTAZ</h1>
    <p class="tagline">Property Consultant</p>

    <div class="socials">
      <a href="#" aria-label="TikTok">TT</a>
      <a href="#" aria-label="Facebook">f</a>
      <a href="#" aria-label="Instagram">IG</a>
    </div>
  </section>

  <section class="links">
    <a class="link" href="#">
      <span class="icon">🏠</span>
      <span><strong>Property Listing</strong><small>Lihat rumah yang tersedia</small></span>
      <span class="arrow">›</span>
    </a>

    <a class="link" href="https://wa.me/" target="_blank" rel="noopener">
      <span class="icon">📲</span>
      <span><strong>WhatsApp Saya</strong><small>Terus hubungi untuk enquiry</small></span>
      <span class="arrow">›</span>
    </a>

    <a class="link" href="#">
      <span class="icon">🔥</span>
      <span><strong>Projek Terkini</strong><small>Promosi & projek terbaru</small></span>
      <span class="arrow">›</span>
    </a>
  </section>

  <div class="section-title">Featured Property</div>

  <article class="property">
    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80" alt="Featured property">
    <div class="property-body">
      <span class="badge">AVAILABLE</span>
      <h2>Single Storey Semi-D</h2>
      <div class="location">📍 Bertam, Melaka</div>
      <div class="price">RM450,000</div>
      <div class="property-actions">
        <a class="btn primary" href="#">View Property</a>
        <a class="btn secondary" href="https://wa.me/" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </article>

  <footer class="footer">HARTAZ © 2026</footer>
</main>
</body>
</html>
