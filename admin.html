<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HARTAZ Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f2eb;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{width:min(1050px,94%);margin:auto;padding:28px 0 50px}
.login{width:min(400px,100%);margin:10vh auto;background:#fff;border:1px solid #e6dfd3;border-radius:20px;padding:25px;box-shadow:0 15px 40px #0000000b}
.brand{font-weight:900;letter-spacing:2px}.sub{color:#777;font-size:12px;margin-top:4px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-top:8px;font-size:14px}
label{display:block;font-size:12px;font-weight:700;margin-top:15px}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;font-weight:800}
.primary{background:#151515;color:#fff;width:100%;margin-top:17px}
.error{color:#b51f2b;font-size:12px;margin-top:10px}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logout{border:1px solid #ddd;background:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card,.panel{background:#fff;border:1px solid #e6dfd3;border-radius:17px}
.card{padding:17px}.label{font-size:11px;color:#777;text-transform:uppercase;letter-spacing:1px}.num{font-size:28px;font-weight:900;margin-top:7px}
.panel{padding:18px;margin-top:15px}.panel h2{font-size:15px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px}
.row:last-child{border-bottom:0}.muted{color:#777}
.badge{font-size:10px;border-radius:99px;padding:5px 8px;background:#f1ede4}
.note{color:#777;font-size:12px;line-height:1.6}
.refresh{float:right;background:#f1ede4;margin-top:-5px}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="loginScreen" class="login">
  <div class="brand">HARTAZ</div>
  <div class="sub">ADMIN LOGIN</div>
  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" required autocomplete="email">
    <label>Password</label>
    <input id="password" type="password" required autocomplete="current-password">
    <button class="primary" type="submit">Login</button>
    <div id="loginError" class="error"></div>
  </form>
</div>

<div id="app" class="wrap hidden">
  <div class="top">
    <div><div class="brand">HARTAZ</div><div class="sub">ADMIN DASHBOARD</div></div>
    <button id="logout" class="logout">Logout</button>
  </div>

  <section class="cards">
    <div class="card"><div class="label">Visitors</div><div id="visitors" class="num">0</div></div>
    <div class="card"><div class="label">WhatsApp Clicks</div><div id="whatsapp" class="num">0</div></div>
    <div class="card"><div class="label">Link Clicks</div><div id="links" class="num">0</div></div>
    <div class="card"><div class="label">Property Views</div><div id="properties" class="num">0</div></div>
  </section>

  <div class="grid">
    <section class="panel">
      <button id="refreshProperties" class="refresh">Refresh</button>
      <h2>Top Properties</h2>
      <div id="propertyList" class="muted">Loading...</div>
    </section>

    <section class="panel">
      <h2>Top Links</h2>
      <div id="linkList" class="muted">Loading...</div>
    </section>
  </div>

  <section class="panel">
    <h2>Supabase Status</h2>
    <div id="status" class="note">Checking...</div>
  </section>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://jiqequbogmshxohzicfn.supabase.co";
const SUPABASE_KEY = "sb_publishable_hHvfFEhVBd7YAXKcxcde5w_-ZqjMz19";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function showApp(){
  $("loginScreen").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadAnalytics();
}

function showLogin(){
  $("app").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
}

async function checkSession(){
  const {data:{session}} = await supabase.auth.getSession();
  if(session) showApp(); else showLogin();
}

$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  $("loginError").textContent = "Logging in...";
  const {error} = await supabase.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });
  if(error){
    $("loginError").textContent = error.message;
    return;
  }
  $("loginError").textContent = "";
  showApp();
});

$("logout").addEventListener("click", async ()=>{
  await supabase.auth.signOut();
  showLogin();
});

async function loadAnalytics(){
  $("status").textContent = "Loading analytics...";
  const {data:summary,error:summaryError} =
    await supabase.from("analytics_summary").select("*").single();

  if(summaryError){
    $("status").textContent = "Connected, tetapi analytics belum ada data.";
    console.error(summaryError);
  }else{
    $("visitors").textContent = summary.visitors ?? 0;
    $("whatsapp").textContent = summary.whatsapp_clicks ?? 0;
    $("links").textContent = summary.link_clicks ?? 0;
    $("properties").textContent = summary.property_views ?? 0;
    $("status").textContent = "Supabase connected.";
  }

  const {data:props,error:propsError} =
    await supabase.from("property_view_counts").select("*").limit(10);

  $("propertyList").innerHTML = propsError
    ? "Unable to load property analytics."
    : props?.length
      ? props.map(p=>`<div class="row"><span>${escapeHtml(p.title)}</span><span>${p.views} views</span></div>`).join("")
      : "Belum ada property.";

  const {data:links,error:linksError} =
    await supabase.from("link_click_counts").select("*").limit(10);

  $("linkList").innerHTML = linksError
    ? "Unable to load link analytics."
    : links?.length
      ? links.map(l=>`<div class="row"><span>${escapeHtml(l.title)}</span><span>${l.clicks} clicks</span></div>`).join("")
      : "Belum ada link.";
}

$("refreshProperties").addEventListener("click",loadAnalytics);

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[c]));
}

supabase.auth.onAuthStateChange((_event,session)=>{
  if(session) showApp(); else showLogin();
});

checkSession();
</script>
</body>
</html>
